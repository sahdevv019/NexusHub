// URL validation helper to prevent javascript: or malformed links
function sanitizeUrl(url) {
  if (!url) return '';
  const s = String(url).trim();
  if (/^https?:\/\/[^\s<>"']+$/i.test(s)) {
    return s;
  }
  return '';
}

// Validate static image path or legacy/external HTTPS image URL (Milestone 7 Hardened)
function validateImagePath(path) {
  if (!path || typeof path !== 'string') return { valid: false, error: 'Path cannot be empty.' };
  const s = path.trim();
  // Reject control characters, newlines, and unencoded spaces
  if (/[\x00-\x1f\x7f\s]/.test(s)) {
    return { valid: false, error: 'Path contains spaces or control characters.' };
  }
  // Reject dangerous URI schemes
  if (/^(javascript|vbscript|data|file|blob):/i.test(s)) {
    return { valid: false, error: 'Dangerous URI schemes are disallowed.' };
  }
  // Reject path traversal attempts (..)
  if (/\.\./.test(s)) {
    return { valid: false, error: 'Path traversal (..) is not allowed.' };
  }
  // Allow root-relative static asset path (/assets/projects/...) or general assets path
  if (/^\/?assets\/[a-zA-Z0-9_\-\.\/]+$/i.test(s)) {
    return { valid: true, path: s.startsWith('assets/') ? '/' + s : (s.startsWith('/') ? s : '/' + s) };
  }
  // Allow legacy Firebase Storage URLs and external HTTPS URLs
  if (/^https:\/\/[a-zA-Z0-9_\-\.]+\.[a-zA-Z]{2,}(?::\d+)?(?:\/[^\s<>"']*)?$/i.test(s)) {
    return { valid: true, path: s };
  }
  return { valid: false, error: 'Please enter a valid static path (/assets/projects/...) or https:// URL.' };
}

// Safely resolve image paths (supporting root-relative /assets/..., legacy Firebase Storage URLs, and external https://)
function resolveImageUrl(path) {
  if (!path || typeof path !== 'string') return '';
  const s = path.trim();
  if (/[\x00-\x1f\x7f\s]/.test(s)) return '';
  if (/^(javascript|vbscript|file|blob):/i.test(s)) return '';
  if (/^data:/i.test(s) && !s.startsWith('data:image/svg+xml')) return '';
  if (/\.\./.test(s)) return '';
  if (/^\/?assets\/[a-zA-Z0-9_\-\.\/]+$/i.test(s)) {
    return s.startsWith('assets/') ? '/' + s : (s.startsWith('/') ? s : '/' + s);
  }
  if (/^https:\/\//i.test(s)) return s;
  return '';
}

// Check if a URL belongs to our Firebase Storage bucket (preserved for backward compatibility)
function isFirebaseStorageUrl(url) {
  if (!url || typeof url !== 'string') return false;
  return url.includes('firebasestorage.googleapis.com') ||
         url.includes('firebasestorage.app') ||
         (typeof firebaseConfig !== 'undefined' && firebaseConfig.storageBucket && url.includes(firebaseConfig.storageBucket));
}

const authState = {
  user: null,
  init() {
    if (isFirebaseReady && authInstance) {
      authInstance.onAuthStateChanged(async (firebaseUser) => {
        if (firebaseUser) {
          const userEmail = (firebaseUser.email || '').toLowerCase().trim();
          const isOwner = userEmail === OWNER_EMAIL.toLowerCase().trim() && (firebaseUser.emailVerified || (firebaseUser.providerData && firebaseUser.providerData.some(p => p.providerId === 'google.com')));
          
          let profileData = null;
          try {
            const userDoc = await dbInstance.collection('users').doc(firebaseUser.uid).get();
            profileData = userDoc.data();
          } catch (e) {
            console.warn("Could not fetch user profile document:", e);
          }

          if (!profileData) {
            const defaultUsername = isOwner ? 'Ayush' : 'User' + Math.floor(1000 + Math.random() * 9000);
            const defaultLower = defaultUsername.toLowerCase();
            profileData = {
              username: defaultUsername,
              username_lower: defaultLower,
              emoji: isOwner ? '👑' : '👾',
              email: userEmail,
              createdAt: new Date().toISOString()
            };
            try {
              const batch = dbInstance.batch();
              batch.set(dbInstance.collection('users').doc(firebaseUser.uid), profileData);
              batch.set(dbInstance.collection('usernames').doc(defaultLower), {
                uid: firebaseUser.uid,
                createdAt: profileData.createdAt
              });
              await batch.commit();
            } catch (e) {
              console.warn("Could not initialize profile document in Firestore:", e);
            }
          }

          this.user = {
            uid: firebaseUser.uid,
            name: profileData.username,
            email: userEmail,
            picture: profileData.emoji,
            isOwner: isOwner
          };

          // If owner signs in, retrieve drafts and all projects (Requirement A.2)
          if (isOwner) {
            await loadOwnerProjects();
          }
        } else {
          this.user = null;
        }
        render();
      });
    } else {
      // In offline mode without Firebase, mock logins are strictly disabled
      this.user = null;
    }
  },
  async loginWithGoogle() {
    if (!isFirebaseReady || !authInstance) {
      toast("Authentication requires an active Firebase connection. Please check your network.", true);
      return;
    }
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try {
      await authInstance.signInWithPopup(provider);
      toast("Signed in successfully!");
      goto('profile');
    } catch (error) {
      console.error("Google sign-in error:", error);
      if (error.code !== 'auth/popup-closed-by-user' && error.code !== 'auth/cancelled-popup-request') {
        toast(error.message || "Sign-in failed.", true);
      }
    }
  },
  async logout() {
    if (isFirebaseReady && authInstance) {
      try {
        await authInstance.signOut();
      } catch (e) {
        console.warn("Sign-out error:", e);
      }
    }
    this.user = null;
    sessionStorage.removeItem('nexushub-unlocked');
    toast('Signed out successfully.');
    goto('');
  }
};

function openDB() {
  return new Promise((resolve) => {
    if (typeof indexedDB === 'undefined') {
      console.warn("IndexedDB not supported in this browser.");
      return resolve(null);
    }
    try {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => {
        try { r.result.createObjectStore(STORE, { keyPath: 'key' }); } catch(e) {}
      };
      r.onsuccess = () => resolve(r.result);
      r.onerror = (e) => {
        console.warn("IndexedDB open error:", e);
        resolve(null);
      };
    } catch (e) {
      console.warn("IndexedDB initialization error:", e);
      resolve(null);
    }
  });
}

function getRec(key) {
  return new Promise((resolve) => {
    if (!localDb) return resolve(null);
    try {
      const tx = localDb.transaction(STORE, 'readonly');
      const r = tx.objectStore(STORE).get(key);
      r.onsuccess = () => resolve(r.result?.value);
      r.onerror = () => resolve(null);
    } catch (e) {
      resolve(null);
    }
  });
}

function setRec(key, value) {
  return new Promise((resolve) => {
    if (!localDb) return resolve();
    try {
      const tx = localDb.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put({ key, value });
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    } catch (e) {
      resolve();
    }
  });
}

async function persistLocalCache() {
  if (!localDb) return;
  try {
    await setRec('projects', data.projects);
    await setRec('feedback', data.feedback || []);
    await setRec('categories', data.categories);
    await setRec('settings', data.settings);
  } catch (e) {
    console.warn("Failed to persist local cache:", e);
  }
}

async function loadData() {
  localDb = await openDB();

  if (isFirebaseReady) {
    try {
      let pSnap;
      // Requirement A.2: Public project queries explicitly filter visibility == 'published'.
      // Verified owners retrieve drafts separately via loadOwnerProjects() or when authenticated.
      if (authState.user && authState.user.isOwner) {
        pSnap = await dbInstance.collection('projects').orderBy('createdAt', 'desc').get();
      } else {
        pSnap = await dbInstance.collection('projects').where('visibility', '==', 'published').get();
      }

      data.projects = pSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      data.projects.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

      // Bounded loading for feedback collection to prevent unbounded memory usage (Requirement D)
      const fSnap = await dbInstance.collection('feedback').orderBy('createdAt', 'desc').limit(200).get();
      data.feedback = fSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

      isOfflineMode = false;
      await persistLocalCache();
      return;
    } catch(e) {
      console.warn("Could not fetch remote documents. Falling back to local cache.", e);
      isOfflineMode = true;
    }
  } else {
    isOfflineMode = true;
  }

  let p = await getRec('projects');
  let f = await getRec('feedback');
  let c = await getRec('categories');
  let s = await getRec('settings');
  if (p && p.length) data.projects = p;
  if (f && f.length) data.feedback = f;
  if (c && c.length) data.categories = c;
  if (s) data.settings = { ...data.settings, ...s };
}

// Separate retrieval of all projects (including drafts) for authenticated verified owners (Requirement A.2)
async function loadOwnerProjects() {
  if (!isFirebaseReady || !dbInstance || !authState.user?.isOwner) return;
  try {
    const snap = await dbInstance.collection('projects').orderBy('createdAt', 'desc').get();
    data.projects = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    data.projects.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    await persistLocalCache();
    render();
  } catch (err) {
    console.warn("Could not load owner projects:", err);
  }
}

function toast(msg, err = false) {
  let t = $('#toast');
  t.textContent = msg;
  t.style.borderColor = err ? '#ef4444' : '#171717';
  t.style.background = err ? '#fef2f2' : '#171717';
  t.style.color = err ? '#991b1b' : '#ffffff';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

function imageMarkup(src, alt, cls = '') {

}

function projectFeedback(p) { 
  return (data.feedback || []).filter(f => f.projectId === p.id); 
}

function getRatingUI(p) {
  let fs = projectFeedback(p);
  if (!fs.length) return `<div class="playstore-rating"><span class="star" style="color:var(--muted)">★</span><span>No reviews yet</span></div>`;
  let avg = (fs.reduce((n, f) => n + Number(f.rating || 0), 0) / fs.length).toFixed(1);
  return `<div class="playstore-rating"><span class="score">${avg}</span><span class="star">★</span><span>(${fs.length})</span></div>`;
}

function filterCategory(cat) {
  data.selectedCategory = cat || '';
  const select = $('#filtercat');
  if (select) select.value = cat || '';
  updateCategoryChips(cat || '');
  fillExplore();
  document.querySelector('#projects')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function updateCategoryChips(cat) {
  data.selectedCategory = cat || '';
  document.querySelectorAll('.categorychip').forEach(chip => {
    const chipCat = chip.getAttribute('data-category') || '';
    if (chipCat === (cat || '')) {
      chip.classList.add('active');
    } else {
      chip.classList.remove('active');
    }
  });
}

function getRatingAvg(p) {
  let fs = projectFeedback(p);
  if (!fs.length) return 0;
  return fs.reduce((sum, f) => sum + Number(f.rating || 0), 0) / fs.length;
}

function fillExplore() {
  let q = ($('#search')?.value || '').toLowerCase().trim();
  let cat = $('#filtercat')?.value || '';
  let sort = $('#sort')?.value || 'newest';
  
  let ps = visibleProjects().filter(p => (!cat || p.category === cat) && [p.name, p.description, ...(p.tags || [])].join(' ').toLowerCase().includes(q));
  
  ps.sort((a, b) => {
    if (sort === 'oldest') {
      return new Date(a.createdAt) - new Date(b.createdAt);
    }
    if (sort === 'featured') {
      return (Number(b.featured) - Number(a.featured)) || (new Date(b.createdAt) - new Date(a.createdAt));
    }
    if (sort === 'rating') {
      const avgA = getRatingAvg(a);
      const avgB = getRatingAvg(b);
      if (avgB !== avgA) return avgB - avgA;
      return new Date(b.createdAt) - new Date(a.createdAt);
    }
    return new Date(b.createdAt) - new Date(a.createdAt);
  });
  
  $('#exploregrid').innerHTML = ps.length ? ps.map(card).join('') : '<div class="empty"><strong>No matches found.</strong><p style="margin:4px 0 0;">Try adjusting your search terms or category filter.</p></div>';
}

async function saveProfileData() {
  let newName = ($('#edit-username-input')?.value || '').trim();
  let newEmoji = data.selectedEmoji || authState.user.picture;
  let lowerName = newName.toLowerCase();

  if (newName.length < 3 || newName.length > 25) return toast('Username must be between 3 and 25 characters.', true);
  if (!/^[a-zA-Z0-9_.-]{3,25}$/.test(newName)) return toast('Username can only contain letters, numbers, underscores, hyphens, and periods.', true);

  const reserved = ['ayush', 'ayush pathak', 'owner', 'admin', 'administrator', 'nexushub'];
  if (reserved.includes(lowerName) && !authState.user.isOwner) {
    return toast('That username is reserved and cannot be used.', true);
  }

  if (isOfflineMode || !isFirebaseReady) {
    return toast('Cannot update profile while offline. Please connect to the internet.', true);
  }

  try {
    const usernameDoc = await dbInstance.collection('usernames').doc(lowerName).get();
    if (usernameDoc.exists && usernameDoc.data().uid !== authState.user.uid) {
      return toast('Username is already taken by another user!', true);
    }

    const userDocRef = dbInstance.collection('users').doc(authState.user.uid);
    const existingSnap = await userDocRef.get();
    const existing = existingSnap.data() || {};

    const profileData = {
      username: newName,
      username_lower: lowerName,
      emoji: newEmoji,
      email: (authState.user.email || existing.email || '').toLowerCase().trim(),
      createdAt: existing.createdAt || new Date().toISOString()
    };

    const batch = dbInstance.batch();
    if (existing.username_lower && existing.username_lower !== lowerName) {
      batch.delete(dbInstance.collection('usernames').doc(existing.username_lower));
    }
    batch.set(dbInstance.collection('usernames').doc(lowerName), {
      uid: authState.user.uid,
      createdAt: profileData.createdAt
    });
    batch.set(userDocRef, profileData, { merge: true });
    await batch.commit();

    authState.user.name = newName;
    authState.user.picture = newEmoji;

    if (data.feedback) {
      data.feedback.forEach(f => {
        if (f.userId === authState.user.uid) {
          f.userName = newName;
          f.userPhoto = newEmoji;
        }
      });
    }

    await persistLocalCache();
    toast('Profile updated successfully!');
    render();
  } catch (err) {
    console.error('Profile update error:', err);
    toast('Failed to update profile: ' + err.message, true);
  }
}

async function deleteUserReview(reviewId) {
  let btn = $('#del-rev-' + reviewId);
  if (btn) { btn.disabled = true; btn.textContent = 'Deleting...'; }

  if (isOfflineMode || !isFirebaseReady) {
    if (btn) { btn.disabled = false; btn.textContent = 'Delete Review'; }
    return toast('Cannot delete review while offline.', true);
  }

  try {
    await dbInstance.collection('feedback').doc(reviewId).delete();
    data.feedback = (data.feedback || []).filter(f => f.id !== reviewId);
    await persistLocalCache();

    let item = $('#review-item-' + reviewId);
    if (item) {
      item.style.transition = 'opacity 0.3s ease';
      item.style.opacity = '0';
      setTimeout(() => { item.remove(); render(); }, 300);
    } else {
      render();
    }
    toast('Review deleted successfully.');
  } catch(e) {
    console.error('Delete review error:', e);
    if (btn) { btn.disabled = false; btn.textContent = 'Delete Review'; }
    toast('Could not delete review: ' + e.message, true);
  }
}

let lastFocusedElement = null;

function openProjectDetail(projectSlug) {
  let p = visibleProjects().find(x => x.slug === projectSlug);
  if (!p) return toast('Project not found.', true);

async function submitFeedback(projectId) {
  let btn = $('#submit-review-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving review...'; }

  if (isOfflineMode || !isFirebaseReady) {
    if (btn) { btn.disabled = false; btn.textContent = 'Post Review'; }
    return toast('Cannot submit reviews in offline mode. Please check connection.', true);
  }

  if (!authState.user) {
    if (btn) { btn.disabled = false; btn.textContent = 'Post Review'; }
    return toast('Please sign in to leave a review.', true);
  }
  
  let p = visibleProjects().find(x => x.id === projectId);
  if (!p) {
    if (btn) { btn.disabled = false; btn.textContent = 'Post Review'; }
    return toast('Project not found.', true);
  }
  
  let userReviews = (data.feedback || []).filter(f => f.projectId === projectId && f.userId === authState.user.uid);
  let existingReview = userReviews[0];

  let rating = Number(data.feedbackDraftRating || (existingReview ? existingReview.rating : 0));
  if (rating < 1 || rating > 5) {
    if (btn) { btn.disabled = false; btn.textContent = existingReview ? 'Update Review' : 'Post Review'; }
    return toast('Please select star rating first.', true);
  }

  let message = ($('#feedbackmessage')?.value || '').trim();
  if (message.length > 500) {
    if (btn) { btn.disabled = false; btn.textContent = existingReview ? 'Update Review' : 'Post Review'; }
    return toast('Please shorten your feedback (max 500 characters).', true);
  }

  const deterministicDocId = `${projectId}_${authState.user.uid}`;
  const reviewData = {
    projectId,
    userId: authState.user.uid,
    rating: Math.round(rating),
    message: message,
    userName: authState.user.name,
    userPhoto: authState.user.picture || '👾',
    createdAt: existingReview ? (existingReview.createdAt || new Date().toISOString()) : new Date().toISOString()
  };

  try {
    // Requirement A.1: Deterministic document ID ({projectId}_{userId}).
    // Safe legacy migration: if a legacy review ID existed, migrate to the deterministic ID and remove legacy doc.
    if (existingReview && existingReview.id !== deterministicDocId) {
      const batch = dbInstance.batch();
      batch.set(dbInstance.collection('feedback').doc(deterministicDocId), reviewData);
      batch.delete(dbInstance.collection('feedback').doc(existingReview.id));
      await batch.commit();
    } else {
      await dbInstance.collection('feedback').doc(deterministicDocId).set(reviewData, { merge: true });
    }

    const savedReview = { id: deterministicDocId, ...reviewData };
    // Remove any legacy document entry and store the canonical review
    data.feedback = (data.feedback || []).filter(f => !(f.projectId === projectId && f.userId === authState.user.uid));
    data.feedback.unshift(savedReview);

    await persistLocalCache();
    data.feedbackDraftRating = 0;
    toast(existingReview ? 'Review updated successfully!' : 'Review posted successfully!');

    if (!$('#projectmodal').classList.contains('hidden')) {
      openProjectDetail(p.slug);
    } else {
      render();
    }
  } catch(e) {
    console.error('Review submission error:', e);
    if (btn) { btn.disabled = false; btn.textContent = existingReview ? 'Update Review' : 'Post Review'; }
    return toast("Could not publish review: " + e.message, true);
  }
}

async function deleteUserReviewModal(reviewId, projectSlug) {
  let btn = $('#del-rev-modal-' + reviewId);
  if (btn) { btn.disabled = true; btn.textContent = 'Deleting...'; }

  if (isOfflineMode || !isFirebaseReady) {
    if (btn) { btn.disabled = false; btn.textContent = 'Delete'; }
    return toast('Cannot delete review in offline mode.', true);
  }

  if (!confirm('Are you sure you want to delete this review?')) {
    if (btn) { btn.disabled = false; btn.textContent = 'Delete'; }
    return;
  }

  try {
    await dbInstance.collection('feedback').doc(reviewId).delete();
    data.feedback = (data.feedback || []).filter(f => f.id !== reviewId);
    await persistLocalCache();
    toast('Review deleted successfully.');
    openProjectDetail(projectSlug);
  } catch(e) {
    console.error('Delete modal review error:', e);
    if (btn) { btn.disabled = false; btn.textContent = 'Delete'; }
    return toast('Could not delete review: ' + e.message, true);
  }
}

                <input type="radio" name="visibility" value="draft" ${p.visibility === 'draft' ? 'checked' : ''} style="accent-color:var(--accent);">
                <span class="badge-status status-beta">Draft</span>
                <span class="hint">Hidden from public showcase, accessible only in owner admin</span>
              </label>
            </div>
          </div>
        </div>
      </div>
      
      <div class="panel">
        <h2>Cover Icon / Image</h2>
        <p class="hint" style="margin:0 0 12px;">Enter static image path in repository (e.g. <code>/assets/projects/my-project/cover.webp</code>) or an existing image URL.</p>
        <div style="display:flex;gap:10px;align-items:center;">
          <input class="field" style="flex:1;" type="text" id="coverpath" placeholder="/assets/projects/my-project/cover.webp" value="${esc(data.coverDraft)}" oninput="updateCoverPreview(this.value)">
          <button class="btn" type="button" onclick="clearCoverPath()">Clear</button>
        </div>
        <span class="hint" style="display:block;margin-top:6px;">Static images are stored under <code>assets/projects/&lt;project-slug&gt;/</code> in your GitHub repository and deployed automatically via Vercel.</span>
        <div class="imagepreview" id="coverpreview" style="margin-top:12px;">
          ${renderCoverPreviewHtml(data.coverDraft)}
        </div>
      </div>

      <div class="panel">
        <h2>Project Gallery / Screenshots</h2>
        <p class="hint" style="margin:0 0 12px;">Add static repository image paths for the showcase gallery (e.g. <code>/assets/projects/my-project/screen-1.webp</code>) or existing URLs.</p>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;">
          <input class="field" style="flex:1;" type="text" id="newscreenpath" placeholder="/assets/projects/my-project/screen-1.webp" onkeydown="if(event.key==='Enter'){event.preventDefault();addScreenshotPath();}">
          <button class="btn primary" type="button" onclick="addScreenshotPath()">+ Add Screenshot</button>
        </div>
        <div id="screenspreview" class="imagepreview" style="display:flex; flex-direction:column; gap:8px; width:100%;">
          ${renderScreenshotsListHtml()}
        </div>
      </div>
      
      <div class="actions">
        <button class="btn primary" type="submit" id="save-project-btn">${id ? 'Save Changes ↗' : 'Publish Project ↗'}</button>
        <button class="btn" type="button" onclick="cancelProjectEdit()">Cancel</button>
      </div>
    </form>
  `, 'projects');
}

function renderCoverPreviewHtml(path) {
  if (!path) {
    return '<div class="hint" style="padding:12px; background:var(--surface-alt); border:1px dashed var(--line); border-radius:var(--radius-xs);">No cover image path specified. Enter a path above to see live preview.</div>';
  }
  const resolved = resolveImageUrl(path);
  return `
    <div style="display:flex; align-items:flex-start; gap:16px; background:var(--surface-alt); padding:14px; border:1px solid var(--line); border-radius:var(--radius-xs); width:100%; box-sizing:border-box;">
      <div style="width:160px; height:90px; border-radius:var(--radius-xs); overflow:hidden; border:1px solid var(--line); background:#fff; flex-shrink:0;">
        <img src="${esc(resolved)}" alt="Cover preview" style="width:100%; height:100%; object-fit:cover;" onerror="this.onerror=null;this.src=FALLBACK_IMAGE;$('#cover-err-msg')?.removeAttribute('hidden');">
      </div>
      <div style="flex:1; min-width:0;">
        <strong style="font-size:13px; color:var(--text); display:block; margin-bottom:4px;">Cover Preview</strong>
        <code style="font-size:12px; word-break:break-all; color:var(--muted);">${esc(path)}</code>
        <div id="cover-err-msg" style="color:var(--danger); font-size:12px; margin-top:6px;" hidden>Image not found or inaccessible at this path. Verify that file exists in <code>assets/</code> or URL is reachable.</div>
      </div>
      <button class="btn small" type="button" onclick="clearCoverPath()">Clear</button>
    </div>
  `;
}

function updateCoverPreview(val) {
  const trimmed = (val || '').trim();
  data.coverDraft = trimmed;
  const box = $('#coverpreview');
  if (box) box.innerHTML = renderCoverPreviewHtml(trimmed);
}

function clearCoverPath() {
  data.coverDraft = '';
  if ($('#coverpath')) $('#coverpath').value = '';
  const box = $('#coverpreview');
  if (box) box.innerHTML = renderCoverPreviewHtml('');
}

function renderScreenshotsListHtml() {
  const images = data.formImages || [];
  if (!images.length) {
    return '<div class="hint" style="padding:12px; background:var(--surface-alt); border:1px dashed var(--line); border-radius:var(--radius-xs); width:100%;">No gallery screenshots added yet. Add paths above.</div>';
  }
  return images.map((im, i) => {
    const raw = typeof im === 'string' ? im : im.src;
    const resolved = resolveImageUrl(raw);
    return `
      <div class="screenshot-row" style="display:flex; align-items:center; gap:14px; background:var(--surface-alt); padding:10px 14px; border:1px solid var(--line); border-radius:var(--radius-xs); width:100%; box-sizing:border-box;">
        <span style="font-size:12px; font-weight:700; color:var(--muted); min-width:24px;">#${i + 1}</span>
        <div style="width:80px; height:45px; border-radius:4px; overflow:hidden; border:1px solid var(--line); background:#fff; flex-shrink:0;">
          <img src="${esc(resolved)}" alt="Screenshot ${i+1}" style="width:100%; height:100%; object-fit:cover;" onerror="this.onerror=null;this.src=FALLBACK_IMAGE;">
        </div>
        <span style="flex:1; font-family:var(--font-mono); font-size:12.5px; color:var(--text); word-break:break-all; min-width:0;">${esc(raw)}</span>
        <div style="display:flex; gap:6px; flex-shrink:0;">
          ${i > 0 ? `<button type="button" class="btn small" title="Move Up" onclick="moveScreenshot(${i}, -1)">↑</button>` : ''}
          ${i < images.length - 1 ? `<button type="button" class="btn small" title="Move Down" onclick="moveScreenshot(${i}, 1)">↓</button>` : ''}
          <button type="button" class="btn small danger" title="Remove" onclick="removeScreenshotItem(${i})">✕</button>
        </div>
      </div>
    `;
  }).join('');
}

function addScreenshotPath() {
  const input = $('#newscreenpath');
  if (!input) return;
  const val = input.value.trim();
  if (!val) return toast('Please enter an image path or URL.', true);
  
  const check = validateImagePath(val);
  if (!check.valid) {
    return toast(check.error, true);
  }

  data.formImages = data.formImages || [];
  data.formImages.push(check.path);
  input.value = '';
  drawScreenshotsList();
  toast('Screenshot path added.');
}

function removeScreenshotItem(i) {
  if (!data.formImages || !data.formImages[i]) return;
  data.formImages.splice(i, 1);
  drawScreenshotsList();
  toast('Screenshot removed.');
}

function moveScreenshot(i, direction) {
  if (!data.formImages) return;
  const targetIndex = i + direction;
  if (targetIndex < 0 || targetIndex >= data.formImages.length) return;
  const temp = data.formImages[i];
  data.formImages[i] = data.formImages[targetIndex];
  data.formImages[targetIndex] = temp;
  drawScreenshotsList();
}

function drawScreenshotsList() {
  const box = $('#screenspreview');
  if (box) box.innerHTML = renderScreenshotsListHtml();
}

function cancelProjectEdit() {
  data.coverDraft = undefined;
  data.formImages = [];
  data.editId = null;
  goto('admin/projects');
}

function suggestSlug() {
  let name = $('#pname').value;
  if (!$('#pslug').dataset.touched) $('#pslug').value = slug(name);
}

function editProject(id) { 
  goto('admin/projects/' + id + '/edit'); 
}

async function saveProject() {
  let btn = $('#save-project-btn');
  const defaultText = data.editId ? 'Save Changes ↗' : 'Publish Project ↗';
  if (btn) { btn.disabled = true; btn.textContent = 'Saving project to database...'; }

  if (isOfflineMode || !isFirebaseReady) {
    if (btn) { btn.disabled = false; btn.textContent = defaultText; }
    return toast('Cannot publish projects while offline. Please connect to the internet.', true);
  }

  let id = data.editId;
  let p = data.projects.find(x => x.id === id);
  let name = ($('#pname')?.value || '').trim();
  let s = ($('#pslug')?.value || '').trim() || slug(name);
  let liveInput = ($('#plive')?.value || '').trim();
  let liveUrl = sanitizeUrl(liveInput);
  let desc = ($('#pdesc')?.value || '').trim();
  
  if (!name || name.length < 2) {
    if (btn) { btn.disabled = false; btn.textContent = defaultText; }
    return toast('Please enter a valid project title (at least 2 characters).', true);
  }

  if (!desc || desc.length < 10) {
    if (btn) { btn.disabled = false; btn.textContent = defaultText; }
    return toast('Please enter a descriptive project summary (at least 10 characters).', true);
  }

  if (liveInput && !liveUrl) {
    if (btn) { btn.disabled = false; btn.textContent = defaultText; }
    return toast('Please enter a valid website URL starting with https:// or http://', true);
  }
  
  let featured = $('#pfeatured')?.checked || false;
  let visibility = document.querySelector('input[name="visibility"]:checked')?.value || 'published';
  
  let coverInput = ($('#coverpath')?.value || '').trim();
  let cover = coverInput;
  if (cover) {
    const checkCover = validateImagePath(cover);
    if (!checkCover.valid) {
      if (btn) { btn.disabled = false; btn.textContent = defaultText; }
      return toast('Cover image: ' + checkCover.error, true);
    }
    cover = checkCover.path;
  }
  let screenshots = (data.formImages || []).map(s => typeof s === 'string' ? s : s?.src).filter(Boolean);
  
  let obj = {
    name,
    slug: s,
    category: $('#pcategory')?.value || data.categories[0],
    description: desc,
    liveUrl, 
    tags: ($('#ptags')?.value || '').split(',').map(x => x.trim()).filter(Boolean),
    visibility,
    featured,
    cover,
    screenshots, 
    createdAt: p?.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };

  try {
    if (id) {
      await dbInstance.collection('projects').doc(id).set(obj, { merge: true });
      obj.id = id;
      data.projects = data.projects.map(x => x.id === id ? obj : x);
    } else {
      const docRef = await dbInstance.collection('projects').add(obj);
      obj.id = docRef.id;
      data.projects.unshift(obj);
    }
    await persistLocalCache();
    data.coverDraft = undefined;
    data.formImages = [];
    data.editId = null;
    toast('Project saved successfully!');
    goto('admin/projects');
  } catch(e) {
    console.error('Project save error:', e);
    if (btn) { btn.disabled = false; btn.textContent = defaultText; }
    toast("Could not write to Cloud Firestore: " + e.message, true);
  }
}

async function togglePublish(id) {
  let p = data.projects.find(x => x.id === id);
  if (!p) return;
  if (isOfflineMode || !isFirebaseReady) {
    return toast('Cannot change visibility while offline.', true);
  }
  const nextVis = p.visibility === 'published' ? 'draft' : 'published';
  try {
    await dbInstance.collection('projects').doc(id).update({
      visibility: nextVis,
      updatedAt: new Date().toISOString()
    });
    p.visibility = nextVis;
    await persistLocalCache();
    toast(`Project set to ${p.visibility}.`);
    render();
  } catch (e) {
    console.error('Toggle publish error:', e);
    toast('Failed to update visibility: ' + e.message, true);
  }
}

async function deleteProject(id) {
  let p = data.projects.find(x => x.id === id);
  if (!p) return;
  const relatedReviews = (data.feedback || []).filter(f => f.projectId === id).length;
  const confirmMsg = `Permanently delete "${p.name}"?\n\nThis will remove the project along with ${relatedReviews} related community review(s). This action cannot be undone.`;
  if (!confirm(confirmMsg)) return;

  if (isOfflineMode || !isFirebaseReady) {
    return toast('Cannot delete project while offline.', true);
  }

  toast('Deleting project and associated data...');

  try {
    const feedbackSnap = await dbInstance.collection('feedback').where('projectId', '==', id).get();
    const reviewDocs = feedbackSnap.docs;

    // Cascade delete reviews in sequential batches of 450 (Firestore limit is 500 ops per batch).
    // Multiple batches are committed sequentially (non-atomic across batches).
    const CHUNK_SIZE = 450;
    for (let i = 0; i < reviewDocs.length; i += CHUNK_SIZE) {
      const chunk = reviewDocs.slice(i, i + CHUNK_SIZE);
      const batch = dbInstance.batch();
      chunk.forEach(doc => {
        batch.delete(doc.ref);
      });
      await batch.commit();
    }

    // Delete project document
    await dbInstance.collection('projects').doc(id).delete();

    data.projects = data.projects.filter(x => x.id !== id);
    data.feedback = (data.feedback || []).filter(f => f.projectId !== id);
    await persistLocalCache();
    toast(`Project "${p.name}" and related reviews deleted.`);
    render();
  } catch(e) {
    console.error('Delete project error:', e);
    toast('Failed to delete project: ' + e.message, true);
  }
}

function feedbackAdmin() {
  let fs = (data.feedback || []).slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  let avg = fs.length ? (fs.reduce((n, f) => n + Number(f.rating || 0), 0) / fs.length).toFixed(1) : '—';
  
  return adminShell(`
    <div class="adminhead">
      <div>
        <span class="kicker">Moderation</span>
        <h1>Community Reviews</h1>
        <p style="color:var(--muted);margin:4px 0;">Review, verify, and moderate feedback submitted across your software projects.</p>
      </div>
      <div style="display:flex;gap:12px;align-items:center;">
        <div class="stat" style="min-width:140px;padding:12px 18px;"><span>Average rating</span><strong style="font-size:24px;">${avg} ★</strong></div>
        <div class="stat" style="min-width:120px;padding:12px 18px;"><span>Total reviews</span><strong style="font-size:24px;">${fs.length}</strong></div>
      </div>
    </div>
    
    <div class="toolbar" style="margin-bottom:20px;">
      <input class="field search" id="feedbacksearch" placeholder="Search reviews by user, message, or project..." oninput="filterAdminFeedback()">
      <select class="field" id="feedbackratingfilter" onchange="filterAdminFeedback()">
        <option value="">All ratings (1-5 ★)</option>
        <option value="5">5 Stars only</option>
        <option value="4">4 Stars</option>
        <option value="3">3 Stars</option>
        <option value="2">2 Stars</option>
        <option value="1">1 Star</option>
      </select>
    </div>

    <div class="panel" id="feedbackadminlist">
      ${renderFeedbackAdminList(fs)}
    </div>
  `, 'feedback');
}

function renderFeedbackAdminList(reviews) {
  if (!reviews.length) {
    return '<div class="empty"><strong>No reviews found.</strong><p style="margin:4px 0 0;">No community reviews match the current filter.</p></div>';
  }
  return reviews.map(f => {
    const proj = data.projects.find(p => p.id === f.projectId);
    const projName = proj ? proj.name : 'Unknown Project (' + f.projectId + ')';
    return `
      <article class="review-admin" style="display:flex;gap:16px;align-items:flex-start;padding:18px 0;border-bottom:1px solid var(--line);">
        ${getAvatarHTML(f.userPhoto, 40, 22)}
        <div style="flex:1;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <strong style="font-size:15px;color:var(--text);">${esc(f.userName || 'Community User')}</strong>
              <span class="card-category" style="font-size:11.5px;">For: ${esc(projName)}</span>
            </div>
            <span style="font-size:12px;color:var(--muted);">${new Date(f.createdAt).toLocaleString()}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="color:#059669;letter-spacing:2px;font-size:14px;">${'★'.repeat(f.rating)}<span style="color:#cbd5e1;">${'★'.repeat(5 - f.rating)}</span></span>
            <span style="font-size:12px;color:var(--muted);">${esc(f.userEmail || '')}</span>
          </div>
          <p style="margin:0 0 8px;font-size:14px;color:var(--text);line-height:1.5;">${f.message ? esc(f.message) : '<em style="color:var(--muted);">No written text provided.</em>'}</p>
        </div>
        <button class="btn small danger" type="button" data-id="${esc(f.id)}" data-user-name="${esc(f.userName || 'User')}" data-project-name="${esc(projName)}" onclick="confirmDeleteFeedback(this.dataset.id, this.dataset.userName, this.dataset.projectName)">Delete</button>
      </article>
    `;
  }).join('');
}

function filterAdminFeedback() {
  let q = ($('#feedbacksearch')?.value || '').toLowerCase().trim();
  let rating = $('#feedbackratingfilter')?.value || '';
  let fs = (data.feedback || []).filter(f => {
    const proj = data.projects.find(p => p.id === f.projectId);
    const matchRating = !rating || String(f.rating) === rating;
    const matchQuery = !q || [f.userName, f.userEmail, f.message, proj?.name || ''].join(' ').toLowerCase().includes(q);
    return matchRating && matchQuery;
  });
  fs.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  const listEl = $('#feedbackadminlist');
  if (listEl) listEl.innerHTML = renderFeedbackAdminList(fs);
}

async function confirmDeleteFeedback(id, userName, projName) {
  if (!confirm(`Permanently remove review from "${userName}" for "${projName}"?`)) return;
  await deleteFeedback(id);
}

async function deleteFeedback(id) {
  if (isOfflineMode || !isFirebaseReady) {
    return toast('Cannot delete review while offline.', true);
  }
  try {
    await dbInstance.collection('feedback').doc(id).delete();
    data.feedback = (data.feedback || []).filter(f => f.id !== id);
    await persistLocalCache();
    toast('Review deleted successfully.');
    if (currentRoute() === 'admin/feedback') {
      filterAdminFeedback();
    } else {
      render();
    }
  } catch(e) {
    console.error('Delete feedback error:', e);
    toast('Failed to delete review: ' + e.message, true);
  }
}

/* --- APP ROUTER --- */
function render() {
  let r = currentRoute();
  document.title = data.settings.siteName + ' — Ideas become things';
  
  if (!isAdminRoute(r)) {
    if (r === 'profile') {
      $('#app').innerHTML = profilePage();
      return;
    }
    $('#app').innerHTML = home();
    $('#search')?.addEventListener('input', fillExplore);
    $('#filtercat')?.addEventListener('change', () => {
      updateCategoryChips($('#filtercat').value);
      fillExplore();
    });
    $('#sort')?.addEventListener('change', fillExplore);
    fillExplore();
    if (r.startsWith('projects/')) setTimeout(() => openProjectDetail(decodeURIComponent(r.slice(9))), 0);
    return;
  } else {
    // Permanent Owner Verification
    if (!authState.user || !authState.user.isOwner) {
      toast(`Access restricted. Please sign in with Google as ${OWNER_EMAIL}.`, true);
      goto('');
      return;
    }
    
    if (r === 'admin') $('#app').innerHTML = dashboard();
    else if (r === 'admin/projects') $('#app').innerHTML = projectsAdmin();
    else if (r === 'admin/feedback') $('#app').innerHTML = feedbackAdmin();
    else if (r === 'admin/projects/new') {
      $('#app').innerHTML = projectForm(null);
      $('#pslug')?.addEventListener('input', () => $('#pslug').dataset.touched = 'yes');
    } else if (r.startsWith('admin/projects/') && r.endsWith('/edit')) {
      let id = r.split('/')[2];
      $('#app').innerHTML = projectForm(id);
      $('#pslug')?.addEventListener('input', () => $('#pslug').dataset.touched = 'yes');
    } else goto('admin');
  }
}

window.addEventListener('hashchange', () => {
  if (location.hash && !location.hash.startsWith('#/') && document.getElementById(decodeURIComponent(location.hash.slice(1)))) return;
  data.coverDraft = undefined;
  render();
  if (isAdminRoute(currentRoute()) || currentRoute() === 'profile') window.scrollTo(0, 0);
});

window.addEventListener('keydown', e => { 
  if (e.key === 'Escape') { 
    closeLightbox(); 
    closeProjectModal(); 
    document.querySelector('#footerinfomodal')?.remove();
    closeMobileNav();
  } 
});
$('#lightbox')?.addEventListener('click', e => { if (e.target.id === 'lightbox') closeLightbox(); });
$('#projectmodal')?.addEventListener('click', e => { if (e.target.id === 'projectmodal') closeProjectModal(); });

function openLightbox(id, i) {
  let p = data.projects.find(x => x.id === id);
  let im = p?.screenshots?.[i] || (p?.cover ? {src: p.cover, alt: p.name} : null);
  let src = typeof im === 'string' ? im : im?.src;
  const resolved = resolveImageUrl(src);
  if (resolved) {
    lastFocusedElement = document.activeElement;
    $('#lightboximg').src = resolved;
    $('#lightboximg').onerror = () => { $('#lightboximg').src = FALLBACK_IMAGE; };
    $('#lightboximg').alt = p.name || 'Preview image';
    $('#lightbox').classList.remove('hidden');
    setTimeout(() => { $('#lightbox .btn')?.focus(); }, 40);
  }
}
function closeLightbox() { 
  $('#lightbox').classList.add('hidden'); 
  if (lastFocusedElement && typeof lastFocusedElement.focus === 'function') {
    lastFocusedElement.focus();
    lastFocusedElement = null;
  }
}

(async () => {
  await loadData();
  authState.init();
  render();
})();
</script>
