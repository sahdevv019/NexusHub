function getAvatarHTML(pic, size = 34, fontSize = 20) {
  if (!pic) return `<div class="comment-avatar" style="width:${size}px;height:${size}px;display:grid;place-items:center;font-weight:700;font-size:${fontSize}px;border-radius:50%;">U</div>`;
  if (!pic.startsWith('http')) {
    return `<div class="comment-avatar" style="width:${size}px;height:${size}px;display:grid;place-items:center;font-size:${fontSize}px;background:var(--line);border-radius:50%;">${pic}</div>`;
  }
  return `<img src="${pic}" class="comment-avatar" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;" alt="Avatar">`;
}

function openDB() {
  return new Promise((resolve, reject) => {
    let r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'key' });
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
function getRec(key) {
  return new Promise((resolve, reject) => {
    let r = localDb.transaction(STORE).objectStore(STORE).get(key);
    r.onsuccess = () => resolve(r.result?.value);
    r.onerror = () => reject(r.error);
  });
}
function setRec(key, value) {
  return new Promise((resolve, reject) => {
    let tx = localDb.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put({ key, value });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function persistLocal() {
  await setRec('projects', data.projects);
  await setRec('feedback', data.feedback || []);
  await setRec('categories', data.categories);
  await setRec('settings', data.settings);
}

async function loadData() {
  if (isFirebaseReady) {
    try {
      const pSnap = await dbInstance.collection('projects').orderBy('createdAt', 'desc').get();
      data.projects = pSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

      const fSnap = await dbInstance.collection('feedback').orderBy('createdAt', 'desc').get();
      data.feedback = fSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      return;
    } catch(e) {
      console.warn("Could not fetch remote documents. Falling back to local cache.", e);
    }
  }

  localDb = await openDB();
  let p = await getRec('projects');
  let f = await getRec('feedback');
  let c = await getRec('categories');
  let s = await getRec('settings');
  if (p) data.projects = p;
  if (f) data.feedback = f;
  if (c) data.categories = c;
  if (s) data.settings = { ...data.settings, ...s };
}

function toast(msg, err = false) {
  let t = $('#toast');
  t.textContent = msg;
  t.style.borderColor = err ? '#ef4444' : '#171717';
  t.style.background = err ? '#fef2f2' : '#171717';
  t.style.color = err ? '#991b1b' : '#ffffff';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

function imageMarkup(src, alt, cls = '') { 
  return src ? `<img class="${cls}" src="${src}" alt="${esc(alt || 'Project thumbnail')}" loading="lazy">` : `<div class="coverplaceholder">N.</div>`; 
}

function projectFeedback(p) { 
  return (data.feedback || []).filter(f => f.projectId === p.id); 
}

function getRatingUI(p) {
  let fs = projectFeedback(p);
  if (!fs.length) return `<div class="playstore-rating"><span class="star" style="color:var(--muted)">★</span><span>No reviews yet</span></div>`;
  let avg = (fs.reduce((n, f) => n + Number(f.rating || 0), 0) / fs.length).toFixed(1);
  return `<div class="playstore-rating"><span class="score">${avg}</span><span class="star">★</span><span>(${fs.length})</span></div>`;
}

function filterCategory(cat) {
  const select = $('#filtercat');
  if (select) select.value = cat;
  fillExplore();
  document.querySelector('#projects')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function fillExplore() {
  let q = ($('#search')?.value || '').toLowerCase().trim();
  let cat = $('#filtercat')?.value || '';
  let sort = $('#sort')?.value || 'newest';
  
  let ps = visibleProjects().filter(p => (!cat || p.category === cat) && [p.name, p.description, ...(p.tags || [])].join(' ').toLowerCase().includes(q));
  
  ps.sort((a, b) => sort === 'oldest' ? new Date(a.createdAt) - new Date(b.createdAt) : sort === 'featured' ? (Number(b.featured) - Number(a.featured)) || new Date(b.createdAt) - new Date(a.createdAt) : new Date(b.createdAt) - new Date(a.createdAt));
  
  $('#exploregrid').innerHTML = ps.length ? ps.map(card).join('') : '<div class="empty"><strong>No matches found.</strong></div>';
}

async function saveProfileData() {
  let newName = $('#edit-username-input').value.trim();
  let newEmoji = data.selectedEmoji || authState.user.picture;
  let lowerName = newName.toLowerCase();

  if (newName.length < 3) return toast('Username must be at least 3 characters.', true);

  const reserved = ['ayush', 'ayush pathak', 'owner', 'admin', 'administrator', 'nexushub'];
  if (reserved.includes(lowerName) && !authState.user.isOwner) {
    return toast('That username is reserved and cannot be used.', true);
  }

  if (isFirebaseReady) {
    let snap = await dbInstance.collection('users').where('username_lower', '==', lowerName).get();
    let isTaken = false;
    snap.forEach(doc => { if (doc.id !== authState.user.uid) isTaken = true; });

    if (isTaken) return toast('Username is already taken by another user!', true);

    await dbInstance.collection('users').doc(authState.user.uid).update({
      username: newName,
      username_lower: lowerName,
      emoji: newEmoji
    });
  }
  
  authState.user.name = newName;
  authState.user.picture = newEmoji;
  localStorage.setItem('nexushub_user', JSON.stringify(authState.user));
  
  if (data.feedback) {
     data.feedback.forEach(f => {
        if (f.userId === authState.user.uid) {
           f.userName = newName;
           f.userPhoto = newEmoji;
        }
     });
  }

  toast('Profile updated successfully!');
  render();
}

async function deleteUserReview(reviewId) {
  if (!confirm('Are you sure you want to delete this review?')) return;
  if (isFirebaseReady) {
    await dbInstance.collection('feedback').doc(reviewId).delete();
  }
  data.feedback = (data.feedback || []).filter(f => f.id !== reviewId);
  await persistLocal();
  toast('Review deleted successfully.');
  render();
}

async function submitFeedback(projectId) {
  let btn = $('#submit-review-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Posting review...'; }

  let rating = Number(data.feedbackDraftRating || 0);
  if (rating < 1 || rating > 5) {
    let existingFs = projectFeedback({id: projectId});
    let myPrev = existingFs.find(f => f.userId === authState.user?.uid);
    if (myPrev) rating = myPrev.rating;
    else {
      if (btn) { btn.disabled = false; btn.textContent = 'Post Review'; }
      return toast('Please select star rating first.', true);
    }
  }

  if (!authState.user) {
    if (btn) { btn.disabled = false; btn.textContent = 'Post Review'; }
    return toast('Please sign in to leave a review.', true);
  }
  
  let p = visibleProjects().find(x => x.id === projectId);
  if (!p) {
    if (btn) { btn.disabled = false; btn.textContent = 'Post Review'; }
    return toast('Project not found.', true);
  }
  
  let message = ($('#feedbackmessage')?.value || '').trim();
  if (message.length > 500) {
    if (btn) { btn.disabled = false; btn.textContent = 'Post Review'; }
    return toast('Please shorten your feedback.', true);
  }

  let userReviews = (data.feedback || []).filter(f => f.projectId === projectId && f.userId === authState.user.uid);
  let existingReview = userReviews[0];

  if (!existingReview && userReviews.length >= 5) {
    if (btn) { btn.disabled = false; btn.textContent = 'Post Review'; }
    return toast('You can only post up to 5 reviews per project. Delete a previous review to post a new one.', true);
  }

  if (isFirebaseReady) {
    try {
      if (existingReview) {
        // Update existing review (prevents rating more than once per review card)
        await dbInstance.collection('feedback').doc(existingReview.id).update({
          rating,
          message,
          userName: authState.user.name,
          userPhoto: authState.user.picture,
          createdAt: new Date().toISOString()
        });
        existingReview.rating = rating;
        existingReview.message = message;
        existingReview.userName = authState.user.name;
        existingReview.userPhoto = authState.user.picture;
      } else {
        const newReview = {
          projectId,
          userId: authState.user.uid,
          rating,
          message,
          userName: authState.user.name,
          userEmail: authState.user.email,
          userPhoto: authState.user.picture,
          createdAt: new Date().toISOString()
        };
        const docRef = await dbInstance.collection('feedback').add(newReview);
        newReview.id = docRef.id;
        data.feedback.unshift(newReview);
      }
    } catch(e) {
      console.error(e);
      if (btn) { btn.disabled = false; btn.textContent = 'Post Review'; }
      return toast("Could not publish review: " + e.message, true);
    }
  } else {
    if (existingReview) {
      existingReview.rating = rating;
      existingReview.message = message;
    } else {
      data.feedback.unshift({
        id: 'f_' + Date.now(),
        projectId,
        userId: authState.user.uid,
        rating,
        message,
        userName: authState.user.name,
        userEmail: authState.user.email,
        userPhoto: authState.user.picture,
        createdAt: new Date().toISOString()
      });
    }
  }
  
  await persistLocal();
  data.feedbackDraftRating = 0;
  toast('Review posted successfully!');
  
  if (!$('#projectmodal').classList.contains('hidden')) {
    openProjectDetail(p.slug);
  } else {
    render();
  }
}

      <a class="btn" href="#/admin/projects">← Back</a>
    </div>
    <form id="projectform" onsubmit="event.preventDefault();saveProject()">
      <div class="panel">
        <div class="formgrid">
          <div class="formfield">
            <label>Project Title *</label>
            <input class="field" id="pname" maxlength="100" required value="${esc(p.name)}" oninput="suggestSlug()" placeholder="e.g. Esports Arena">
          </div>
          <div class="formfield">
            <label>URL Slug</label>
            <input class="field" id="pslug" maxlength="90" value="${esc(p.slug)}" placeholder="e.g. esports-arena">
          </div>
          <div class="formfield">
            <label>Category</label>
            <select class="field" id="pcategory">${data.categories.map(c => `<option ${c === p.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
          </div>
          <div class="formfield">
            <label>Live URL</label>
            <input class="field" id="plive" type="text" placeholder="https://..." value="${esc(p.liveUrl)}">
          </div>
          <div class="formfield full">
            <label>Description *</label>
            <textarea class="field" id="pdesc" maxlength="500" required placeholder="Project overview...">${esc(p.description)}</textarea>
          </div>
          <div class="formfield">
            <label>Tags</label>
            <input class="field" id="ptags" value="${esc(p.tags.join(', '))}" placeholder="React, Web">
          </div>
          <div class="formfield">
            <label>Visibility</label>
            <div class="checkrow">
              <label><input type="radio" name="visibility" value="published" ${p.visibility === 'published' ? 'checked' : ''}> Published (Live)</label>
              <label><input type="radio" name="visibility" value="draft" ${p.visibility === 'draft' ? 'checked' : ''}> Draft</label>
            </div>
          </div>
        </div>
      </div>
      
      <div class="panel">
        <h2>Cover Icon / Image</h2>
        <input class="field" type="file" id="coverfile" accept="image/png,image/jpeg,image/webp" onchange="previewCover(this)">
        <div class="imagepreview" id="coverpreview">
          ${p.cover ? `<div class="imageitem"><img src="${p.cover}" alt="Cover"><button type="button" onclick="removeCover()">×</button></div>` : ''}
        </div>
      </div>

      <div class="panel">
        <h2>Project Gallery / Screenshots</h2>
        <p class="hint">Upload screenshots to showcase your work in the project details view.</p>
        <input class="field" type="file" id="screensfiles" accept="image/png,image/jpeg,image/webp" multiple onchange="previewScreens(this)">
        <div id="screenspreview" class="imagepreview">
          ${(data.formImages || []).map((im, i) => `
            <div class="imageitem">
              <img src="${im.src}" alt="${esc(im.alt || 'Screenshot')}">
              <button type="button" onclick="removeExistingScreenshot(${i})">×</button>
            </div>
          `).join('')}
        </div>
      </div>
      
      <div class="actions">
        <button class="btn primary" type="submit" id="save-project-btn">Publish to Website ↗</button>
        <button class="btn" type="button" onclick="goto('admin/projects')">Cancel</button>
      </div>
    </form>
  `, 'projects');
}

function readFile(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    if (file.size > 5 * 1024 * 1024) return reject(new Error('Image must be under 5MB.'));
    let r = new FileReader();
    r.onload = () => resolve({ src: r.result, name: file.name, alt: 'Screenshot' });
    r.onerror = () => reject(new Error('Could not read image file.'));
    r.readAsDataURL(file);
  });
}

async function previewCover(input) {
  try {
    data.coverDraft = await readFile(input.files[0]);
    $('#coverpreview').innerHTML = data.coverDraft ? `<div class="imageitem"><img src="${data.coverDraft.src}" alt="Cover"><button type="button" onclick="removeCover()">×</button></div>` : '';
  } catch (e) {
    toast(e.message, true);
  }
}

function removeCover() {
  data.coverDraft = null;
  $('#coverfile').value = '';
  $('#coverpreview').innerHTML = '';
}

async function previewScreens(input) {
  try {
    let files = Array.from(input.files);
    let newOnes = await Promise.all(files.map(readFile));
    data.formImages = [...(data.formImages || []), ...newOnes];
    drawNewScreens();
  } catch (e) {
    toast(e.message, true);
  }
}

function drawNewScreens() {
  let box = $('#screenspreview');
  if (!box) return;
  box.innerHTML = (data.formImages || []).map((im, i) => `
    <div class="imageitem">
      <img src="${im.src}" alt="Screenshot">
      <button type="button" onclick="removeExistingScreenshot(${i})">×</button>
    </div>
  `).join('');
}

function removeExistingScreenshot(i) {
  data.formImages.splice(i, 1);
  drawNewScreens();
}

function suggestSlug() {
  let name = $('#pname').value;
  if (!$('#pslug').dataset.touched) $('#pslug').value = slug(name);
}

function editProject(id) { 
  goto('admin/projects/' + id + '/edit'); 
}

async function saveProject() {
  let btn = $('#save-project-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Publishing to website...'; }

  let id = data.editId;
  let p = data.projects.find(x => x.id === id);
  let name = $('#pname').value.trim();
  let s = $('#pslug').value.trim() || slug(name);
  let liveUrl = $('#plive').value.trim();
  let desc = $('#pdesc').value.trim();
  
  if (!name || !desc) {
    if (btn) { btn.disabled = false; btn.textContent = 'Publish to Website ↗'; }
    return toast('Please complete the title and description.', true);
  }
  if (liveUrl && !/^https?:\/\//i.test(liveUrl)) liveUrl = 'https://' + liveUrl;
  
  let visibility = document.querySelector('input[name="visibility"]:checked')?.value || 'published';
  let cover = data.coverDraft !== undefined ? (data.coverDraft ? data.coverDraft.src : '') : (p?.cover || '');
  let screenshots = data.formImages || p?.screenshots || [];
  
  let obj = {
    name, slug: s, category: $('#pcategory')?.value || data.categories[0], description: desc, liveUrl, 
    tags: ($('#ptags')?.value || '').split(',').map(x => x.trim()).filter(Boolean),
    visibility, featured: p?.featured || false, cover, screenshots, 
    createdAt: p?.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString()
  };

  if (isFirebaseReady) {
    try {
      if (id) {
        await dbInstance.collection('projects').doc(id).set(obj, { merge: true });
        obj.id = id;
        data.projects = data.projects.map(x => x.id === id ? obj : x);
      } else {
        const docRef = await dbInstance.collection('projects').add(obj);
        obj.id = docRef.id;
        data.projects.unshift(obj);
      }
    } catch(e) {
      console.error(e);
      if (btn) { btn.disabled = false; btn.textContent = 'Publish to Website ↗'; }
      return toast("Could not write to Cloud Firestore: " + e.message, true);
    }
  } else {
    obj.id = id || ('p_' + Date.now());
    if (p) data.projects = data.projects.map(x => x.id === id ? obj : x);
    else data.projects.unshift(obj);
  }
  
  await persistLocal();
  data.coverDraft = undefined;
  data.editId = null;
  toast('Project saved and published successfully!');
  goto('');
}

async function togglePublish(id) {
  let p = data.projects.find(x => x.id === id);
  if (!p) return;
  p.visibility = p.visibility === 'published' ? 'draft' : 'published';
  if (isFirebaseReady) {
    await dbInstance.collection('projects').doc(id).update({ visibility: p.visibility });
  }
  await persistLocal();
  toast(`Project set to ${p.visibility}.`);
  render();
}

async function deleteProject(id) {
  let p = data.projects.find(x => x.id === id);
  if (!p || !confirm(`Permanently remove "${p.name}"?`)) return;
  if (isFirebaseReady) {
    await dbInstance.collection('projects').doc(id).delete();
  }
  data.projects = data.projects.filter(x => x.id !== id);
  data.feedback = (data.feedback || []).filter(f => f.projectId !== id);
  await persistLocal();
  toast('Project deleted.');
  render();
}

function feedbackAdmin() {
  let fs = (data.feedback || []).slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  let avg = fs.length ? (fs.reduce((n, f) => n + Number(f.rating || 0), 0) / fs.length).toFixed(1) : '—';
  
  return adminShell(`
    <div class="adminhead">
      <div>
        <span class="kicker">Moderation</span>
        <h1>Community Reviews</h1>
      </div>
      <div class="stat"><span>Average rating</span><strong>${avg} ★</strong></div>
    </div>
    <div class="panel">
      <h2>All Reviews (${fs.length})</h2>
      ${fs.map(f => `
        <article class="review-admin">
          <div>
            <strong>${esc(f.userName || 'User')}</strong> <span style="color:#059669;">${'★'.repeat(f.rating)}</span>
            <p style="margin:4px 0;">${esc(f.message || 'No written text')}</p>
            <span class="hint">${esc(f.userEmail || '')} ·${new Date(f.createdAt).toLocaleString()}</span>
          </div>
          <button class="btn small danger" onclick="deleteFeedback('${f.id}')">Delete</button>
        </article>
      `).join('') || '<div class="empty">No reviews logged yet.</div>'}
    </div>
  `, 'feedback');
}

async function deleteFeedback(id) {
  if (!confirm('Permanently remove this review?')) return;
  if (isFirebaseReady) {
    await dbInstance.collection('feedback').doc(id).delete();
  }
  data.feedback = (data.feedback || []).filter(f => f.id !== id);
  await persistLocal();
  toast('Review deleted.');
  render();
}

/* --- APP ROUTER --- */
function render() {
  let r = currentRoute();
  document.title = data.settings.siteName + ' — Ideas become things';
  
  if (!isAdminRoute(r)) {
    if (r === 'profile') {
      $('#app').innerHTML = profilePage();
      return;
    }
    $('#app').innerHTML = home();
    $('#search')?.addEventListener('input', fillExplore);
    $('#filtercat')?.addEventListener('change', fillExplore);
    $('#sort')?.addEventListener('change', fillExplore);
    fillExplore();
    if (r.startsWith('projects/')) setTimeout(() => openProjectDetail(decodeURIComponent(r.slice(9))), 0);
    return;
  } else {
    if (!authState.user || !authState.user.isOwner) {
      toast(`Access restricted. Please sign in with Google as ${OWNER_EMAIL}.`, true);
      goto('');
      return;
    }
    
    if (r === 'admin') $('#app').innerHTML = dashboard();
    else if (r === 'admin/projects') $('#app').innerHTML = projectsAdmin();
    else if (r === 'admin/feedback') $('#app').innerHTML = feedbackAdmin();
    else if (r === 'admin/projects/new') {
      $('#app').innerHTML = projectForm(null);
      $('#pslug')?.addEventListener('input', () => $('#pslug').dataset.touched = 'yes');
    } else if (r.startsWith('admin/projects/') && r.endsWith('/edit')) {
      let id = r.split('/')[2];
      $('#app').innerHTML = projectForm(id);
      $('#pslug')?.addEventListener('input', () => $('#pslug').dataset.touched = 'yes');
    } else goto('admin');
  }
}

window.addEventListener('hashchange', () => {
  if (location.hash && !location.hash.startsWith('#/') && document.getElementById(decodeURIComponent(location.hash.slice(1)))) return;
  data.coverDraft = undefined;
  render();
  if (isAdminRoute(currentRoute()) || currentRoute() === 'profile') window.scrollTo(0, 0);
});

window.addEventListener('keydown', e => { 
  if (e.key === 'Escape') { closeLightbox(); closeProjectModal(); } 
});
$('#lightbox')?.addEventListener('click', e => { if (e.target.id === 'lightbox') closeLightbox(); });
$('#projectmodal')?.addEventListener('click', e => { if (e.target.id === 'projectmodal') closeProjectModal(); });

function openLightbox(id, i) {
  let p = data.projects.find(x => x.id === id);
  let im = p?.screenshots?.[i] || (p?.cover ? {src: p.cover, alt: p.name} : null);
  if (im) {
    $('#lightboximg').src = im.src;
    $('#lightboximg').alt = im.alt || p.name;
    $('#lightbox').classList.remove('hidden');
  }
}
function closeLightbox() { $('#lightbox').classList.add('hidden'); }

(async () => {
  await loadData();
  authState.init();
  render();
})();
</script>
</body>
</html>
